<script>
const icons={Home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',Search:'<circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/>',Movies:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v4m5-4v4m5-4v4M7 16v4m5-4v4m5-4v4M3 8h18M3 16h18"/>',TV:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m9 2 3 3 3-3M8 19v3m8-3v3m-5-10 4 2-4 2z"/>',Settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.8 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.8-1l-1.7.6-1.4-2.4L7.1 15a8 8 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.8-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.8 1l1.7-.6 1.4 2.4-1.4 1.1a8 8 0 0 1-.1 2z"/>',Folder:'<path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'};
 let state={page:'Home',filter:'all',data:null,auth:null,catalog:[],catalogType:'movie',catalogBusy:false,home:null,homeBusy:false};const navItems=[['Home','Home'],['Discover','Search'],['Library','Folder'],['Movies','Movies'],['TV Shows','TV'],['Settings','Settings']];
async function api(url,opts={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||r.statusText);return d}
function toast(s){const el=document.getElementById('toast');el.innerHTML=`<div class="notice">${esc(s)}</div>`;setTimeout(()=>el.innerHTML='',3200)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmtBytes(n){if(n<1e9)return`${(n/1e6).toFixed(0)} MB`;return`${(n/1e9).toFixed(1)} GB`}
async function load(){const auth=await api('/api/auth/status');state.auth=auth;if(!auth.authenticated){renderAuth(auth);return}state.data=await api('/api/overview');render()}
function renderNav(){document.getElementById('search').style.display='';document.getElementById('search').placeholder=['Library','Movies','TV Shows'].includes(state.page)?'Search your library…':'Search movies and TV…';const account=document.getElementById('account-button');account.textContent=(state.auth?.username||'H').slice(0,1).toUpperCase();account.title=`Signed in as ${state.auth?.username||'local account'} · Click to lock`;account.onclick=logout;document.getElementById('nav').innerHTML=navItems.map(([n,i])=>`<button class="${state.page===n?'active':''}" data-page="${n}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${icons[i]}</svg><span>${n}</span></button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;if(state.page==='Home')state.home=null;render()})}
function renderAuth(auth){document.getElementById('nav').innerHTML='';document.getElementById('crumb').textContent='Local account';document.getElementById('search').style.display='none';const setup=!auth.configured;document.getElementById('content').innerHTML=`<div style="max-width:520px;margin:8vh auto 0"><div class="eyebrow">${setup?'Private on this PC':'Welcome back'}</div><h1 style="font-size:30px;margin:8px 0 6px">${setup?'Create your Hearth account':'Sign in to Hearth'}</h1><p style="color:var(--muted);margin:0 0 24px">${setup?'Create a local account to protect access to your saved media settings. Your keys, libraries and preferences stay on this PC.':'Sign in to open your saved libraries, API connections and preferences.'}</p><div class="modal" style="max-width:none;margin:0;padding:24px"><div class="field"><label for="auth-user">Username</label><input id="auth-user" autocomplete="username" placeholder="Username"></div><div class="field"><label for="auth-password">Password</label><input id="auth-password" type="password" autocomplete="${setup?'new-password':'current-password'}" placeholder="${setup?'At least 8 characters':'Password'}"></div><label style="display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;margin:12px 0 18px"><input id="remember-account" type="checkbox" checked> Keep me signed in on this PC</label><div id="auth-error" style="color:#e6a09a;font-size:12px;margin:8px 0"></div><button class="btn" id="auth-submit" style="width:100%">${setup?'Create account':'Sign in'}</button></div><p style="font-size:11px;color:var(--muted);margin-top:13px">This is a local Hearth account, not a cloud account. Use the same Windows account to open saved credentials.</p></div>`;document.getElementById('account-button').textContent='H';document.getElementById('account-button').onclick=null;document.getElementById('auth-submit').onclick=async()=>{const button=document.getElementById('auth-submit'),body={username:document.getElementById('auth-user').value,password:document.getElementById('auth-password').value,remember:document.getElementById('remember-account').checked};button.disabled=true;button.textContent=setup?'Creating…':'Signing in…';try{await api(setup?'/api/auth/create':'/api/auth/login',{method:'POST',body:JSON.stringify(body)});await load()}catch(e){document.getElementById('auth-error').textContent=e.message;button.disabled=false;button.textContent=setup?'Create account':'Sign in'}};document.getElementById('auth-password').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('auth-submit').click()})}

 if(state.page==='Settings'){document.getElementById('content').innerHTML=`<div class="welcome"><div><div class="eyebrow">Preferences</div><h1>Settings</h1><p>Connect your metadata and streaming sources.</p></div></div><section class="section-head"><h2>Appearance</h2><span>Saved on this host</span></section><div class="setting-row"><div><b>Product name</b><small>Set a name for this media server.</small></div><input id="pref-name" value="${esc(prefs.product_name||'Project Hearth')}"></div><div class="setting-row"><div><b>Accent colour</b><small>Used for selected states and highlights.</small></div><input id="pref-accent" type="color" value="${esc((prefs.accent==='#e7a86b'?'#e50914':(prefs.accent||'#e50914')))}"></div><div style="margin-top:18px"><button class="btn" id="save-prefs">Save preferences</button></div><section class="section-head"><h2>TMDB</h2><span>Movie and TV metadata</span></section><div class="setting-row"><div><b>API key</b><small>Get a free key from your TMDB account. Encrypted for this Windows user.</small></div><input id="tmdb-key" type="password" placeholder="Paste TMDB API key"></div><div style="margin-top:12px"><button class="btn" id="save-tmdb">Save TMDB key</button> <span id="tmdb-state" style="font-size:11px;color:var(--muted)"></span></div><section class="section-head"><h2>TorBox</h2><span>Cached stream resolver</span></section><div class="setting-row"><div><b>API key</b><small>Saved encrypted for this Windows user. Find it in TorBox account settings.</small></div><input id="torbox-key" type="password" placeholder="Enter to connect or leave blank to disconnect"></div><div style="margin-top:12px"><button class="btn" id="save-torbox">Save TorBox connection</button> <span id="torbox-state" style="font-size:11px;color:var(--muted)"></span></div><section class="section-head"><h2>Debridio</h2><span>Debridio Stremio streams</span></section><div class="setting-row"><div><b>API key or install URL</b><small>Paste the Debridio API key, or its generated async function renderHome(){const content=document.getElementById('content');if(!state.home&&!state.homeBusy){state.homeBusy=true;content.innerHTML='<div class="hero-feature hero-empty"><div><div class="eyebrow">Project Hearth</div><h1>Entertainment, all in one place.</h1><p>Loading your streaming home…</p></div></div>';try{state.home=await api('/api/discovery/home')}catch(e){state.home={error:e.message}}finally{state.homeBusy=false;renderHome();return}}if(state.homeBusy)return;const h=state.home||{},trending=h.suggested||[],fresh=h.new||[],local=state.data.items.filter(x=>!!x.updated_at&&(!Number(x.progress_duration)||Number(x.position)<Number(x.progress_duration)-90)).sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||'')));const hero=trending.find(x=>x.backdrop)||trending[0];const row=(title,items,key,wide=false,page='Discover')=>items?.length?`${renderHomeRail(title,items,key,wide)}<button class="see-more" data-see-more="${page}">See all ${esc(title.toLowerCase())} <span>›</span></button>`:'';if(!hero){content.innerHTML=`<div class="hero-feature hero-empty"><div><div class="hero-kicker">Your streaming home</div><h1>Movies and series, ready to explore.</h1><p>${esc(h.error||'Connect a TMDB API key in Settings to load popular titles and recommendations.')}</p><button class="btn" id="home-settings">Open settings</button></div></div>${renderHomeRail('Continue watching',local,'continue',true)}<div class="home-footer">Browse streaming titles in Movies, TV Shows, and Discover.</div>`;document.getElementById('home-settings').onclick=()=>{state.page='Settings';render()};return}content.innerHTML=`<section class="hero-feature" style="background-image:url('${tmdbImage(hero.backdrop,'original')}')"><div class="hero-copy"><div class="hero-kicker">${hero.type==='tv'?'Featured series':'Featured movie'}${hero.year?' · '+esc(hero.year):''}</div><h1>${esc(hero.title)}</h1><p>${esc(hero.overview||'Find your next favourite and check connected streaming sources.' async function watchScan(id){try{let s=await api('/api/scan/'+id),el=document.getElementById('scan-'+id);if(!el)return;el.textContent=s.status==='running'?`◌ Scanning · ${s.indexed||0} indexed / ${s.discovered||0} found`:s.status==='error'?`● Scan error · ${s.message||'check folder access'}`:`● Indexed · ${s.indexed??''} items`;if(s.status==='running')setTimeout(()=>watchScan(id),1300)}catch{}}
function showAdd(){document.getElementById('overlay').innerHTML=`<div class="modal-wrap"><div class="modal"><h2>Add a library</h2><p>Choose a folder on this computer. Hearth reads media files without moving or changing them.</p><div class="field"><label for="lib-name">Library name</label><input id="lib-name" placeholder="e.g. Films at home"></div><div class="field"><label for="lib-kind">Content type</label><select id="lib-kind"><option value="movies">Movies</option><option value="tv">TV shows</option></select></div><div class="field"><label for="lib-path">Folder path</label><div class="path-row"><input id="lib-path" placeholder="Choose a folder…"><button class="btn secondary small" id="pick">Browse</button></div></div><div id="form-error" style="color:#e6a09a;font-size:11px"></div><div class="modal-actions"><button class="btn secondary" id="cancel">Cancel</button><button class="btn" id="create">Add and scan</button></div></div></div>`;document.getElementById('cancel').onclick=()=>document.getElementById('overlay').innerHTML='';document.querySelector('.modal-wrap').onclick=e=>{if(e.target.classList.contains('modal-wrap'))document.getElementById('overlay').innerHTML=''};document.getElementById('lib-kind').onchange=e=>{if(!document.getElementById('lib-name').value)document.getElementById('lib-name').value=e.target.value==='tv'?'TV Shows':'Movies'};document.getElementById('pick').onclick=async()=>{try{let r=await api('/api/pick-folder',{method:'POST',body:'{}'});if(r.error)throw Error(r.error);document.getElementById('lib-path').value=r.path;if(!document.getElementById('lib-name').value)document.getElementById('lib-name').value=document.getElementById('lib-kind').value==='tv'?'TV Shows':'Movies'}catch(e){document.getElementById('form-error').textContent=e.message}};document.getElementById('create').onclick=async()=>{let b=document.getElementById('create');b.disabled=true;b.textContent='Starting scan…';try{await api('/api/libraries',{method:'POST',body:JSON.stringify({na function renderDiscover(){const content=document.getElementById('content'),search=document.getElementById('search');search.placeholder='Search movies and TV…';const q=search.value.trim();if(q){content.innerHTML=`<section class="welcome"><div><div class="eyebrow">Discover</div><h1>Find something to watch.</h1><p>Search movies and TV shows, then check your connected sources.</p></div><div style="display:flex;gap:8px"><button class="btn ${state.catalogType==='movie'?'':'secondary'}" id="type-movie">Movies</button><button class="btn ${state.catalogType==='tv'?'':'secondary'}" id="type-tv">TV shows</button></div></section><div class="section-head"><h2>Search results</h2></div>${state.catalogBusy?'<div class="empty">Searching…</div>':`<div class="media-grid">${mediaCards(state.catalog,'search')}</div>`}`;document.getElementById('type-movie').onclick=()=>{state.catalogType='movie';searchCatalog(q)};document.getElementById('type-tv').onclick=()=>{state.catalogType='tv';searchCatalog(q)};wireCards({search:state.catalog});return}if(!state.discoverHome&&!state.discoverBusy){loadBrowseHome('discover');content.innerHTML='<div class="hero-feature hero-empty"><div><h1>Discover something brilliant.</h1><p>Loading popular movies and series…</p></div></div>';return}const h=state.discoverHome||{};content.innerHTML=`<section class="welcome"><div><div class="eyebrow">Discover</div><h1>Popular on Hearth</h1><p>Browse what's popular across movies and TV shows.</p></div></section><section class="section-head"><h2>Popular movies</h2><button class="link-button" data-go="Movies">See all movies ›</button></section><div class="media-grid">${mediaCards(h.popular_movies,'dm')}</div><section class="section-head"><h2>Popular TV shows</h2><button class="link-button" data-go="TV Shows">See all TV shows ›</button></section><div class="media-grid">${mediaCards(h.popular_tv,'dt')}</div><section class="section-head"><h2>Trending this week</h2></section><div class="rail poster-portrait">${mediaCards(h.suggested,'tr')}</div>`;wireCards({dm:h.popular_movies,dt:h.popular_tv,tr:h.suggested});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.page=b.dataset.go;state.showcaseCategory='popular';state.showcaseData=null;render()})}

async function renderShowcase(){const content=document.getElementById('content'),isTv=state.page==='TV Shows',kind=isTv?'tv':'movie',title=isTv?'TV Shows':'Movies',search=document.getElementById('search'),q=search.value.trim();search.placeholder=`Search ${title.toLowerCase()}…`;const cats=[['popular','Popular'],['trending','Trending'],['new',isTv?'On the air':'Now playing'],['top_rated','Top rated']];if(q){content.innerHTML=`<section class="welcome"><div><div class="eyebrow">${title}</div><h1>Search ${title.toLowerCase()}</h1><p>Find a title and check your connected streaming sources.</p></div></section>${state.catalogBusy?'<div class="empty">Searching…</div>':`<div class="media-grid showcase-grid">${mediaCards(state.catalog,'showcaseSearch')}</div>`}`;wireCards({showcaseSearch:state.catalog});return}if(!state.showcaseData||state.showcaseType!==kind){content.innerHTML=`<div class="hero-feature hero-empty"><div><div class="hero-kicker">${title}</div><h1>Find your next ${isTv?'series':'movie'}.</h1><p>Loading the full ${title.toLowerCase()} catalog…</p></div></div>`;state.showcaseType=kind;state.showcaseCategory='popular';try{state.showcaseData={};for(const [key] of cats){const d=await api(`/api/discovery/catalog?type=${kind}&category=${key}`);state.showcaseData[key]=d.items||[]} }catch(e){state.showcaseError=e.message}renderShowcase();return}const cat=state.showcaseCategory||'popular',items=state.showcaseData[cat]||[],hero=items.find(x=>x.backdrop)||items[0];content.innerHTML=`${hero?`<section class="hero-feature" style="background-image:url('${tmdbImage(hero.backdrop,'original')}')"><div class="hero-copy"><div class="hero-kicker">${title} · ${esc((cats.find(x=>x[0]===cat)||cats[0])[1])}</div><h1>${esc(hero.title)}</h1><p>${esc(hero.overview||'Explore the catalog and find available streams.')}</p><div class="hero-actions"><button class="btn" id="showcase-play">▶ &nbsp;Find streams</button></div></div></section>`:`<section class="welcome"><div><div class="eyebrow">${title}</div><h1>Explore ${title.toLowerCase()}</h1></div></section>`}<div class="catalog-tabs">${cats.map(([key,label])=>`<button class="${cat===key?'selected':''}" data-category="${key}">${label}</button>`).join('')}</div><section class="section-head"><h2>${(cats.find(x=>x[0]===cat)||cats[0])[1]} ${title.toLowerCase()}</h2><span>${items.length} titles</span></section>${state.showcaseError?`<div class="empty">${esc(state.showcaseError)}</div>`:''}<div class="media-grid showcase-grid">${mediaCards(items,'showcase')}</div>`;if(hero)document.getElementById('showcase-play').onclick=()=>openTitle(hero);document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{state.showcaseCategory=b.dataset.category;renderShowcase()});wireCards({showcase:items})}
let catalogTimer;async function searchCatalog(q,target='Discover'){if(target==='Discover')state.page='Discover';state.catalogType=target==='TV Shows'?'tv':target==='Movies'?'movie':state.catalogType;renderNav();state.catalogBusy=true;render();try{const d=await api(`/api/discovery/search?q=${encodeURIComponent(q)}&type=${state.catalogType}`);state.catalog=d.items||[]}catch(e){state.catalog=[];toast(e.message)}finally{state.catalogBusy=false;render()}}
async function openTitle(item){document.getElementById('overlay').innerHTML=`<div class="modal-wrap"><div class="modal"><h2>${esc(item.title)} ${item.year?`(${esc(item.year)})`:''}</h2><p>${esc(item.overview||'No synopsis available.')}</p><div id="episode-picker"></div><div style="display:flex;gap:8px;align-items:center;margin:14px 0"><button class="btn secondary" id="source-close">Close</button><span id="source-status" style="font-size:12px;color:var(--muted)">${item.type==='tv'?'Choose a season and episode to find streams.':'Checking your sources…'}</span></div><div id="source-list"></div></div></div>`;document.getElementById('source-close').onclick=()=>document.getElementById('overlay').innerHTML='';if(item.type==='tv'){try{const data=await api(`/api/discovery/episodes?id=${encodeURIComponent(item.id)}`);const seasons=(data.seasons||[]).filter(x=>x.number!==undefined&&x.number!==null);if(!seasons.length){document.getElementById('source-status').textContent='TMDB has no season information for this show.';return}const chosen=seasons.find(x=>x.number===1)||seasons.find(x=>x.number>0)||seasons[0];document.getElementById('episode-picker').innerHTML=`<div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:12px 0"><div class="field" style="margin:0"><label for="season-select">Season</label><select id="season-select">${seasons.map(x=>`<option value="${x.number}" ${x.number===chosen.number?'selected':''}>${esc(x.name||`Season ${x.number}`)}</option>`).join('')}</select></div><div class="field" style="margin:0"><label for="episode-select">Episode</label><select id="episode-select"></select></div><button class="btn" id="find-episode-streams">Find streams</button></div>`;const seasonSelect=document.getElementById('season-select'),episodeSelect=document.getElementById('episode-select');const loadEpisodes=async()=>{episodeSelect.innerHTML='<option>Loading…</option>';try{const eps=await api(`/api/discovery/episodes?id=${encodeURIComponent(item.id)}&season=${encodeURIComponent(seasonSelect.value)}`);episodeSelect.innerHTML=(eps.episodes||[]).map(e=>`<option value="${e.number}">E${String(e.number).padStart(2,'0')} · ${esc(e.name||`Episode ${e.number}`)}</option>`).join('')||'<option value="">No episodes</option>'}catch(e){episodeSelect.innerHTML='<option value="">Could not load episodes</option>';document.getElementById('source-status').textContent=e.message}};seasonSelect.onchange=loadEpisodes;await loadEpisodes();document.getElementById('find-episode-streams').onclick=()=>{const ep=episodeSelect.value;if(!ep){document.getElementById('source-status').textContent='Choose an episode first.';return}findTitleStreams(item,Number(seasonSelect.value),Number(ep))}}catch(e){document.getElementById('source-status').textContent=e.message}}else findTitleStreams(item)}
async function findTitleStreams(item,season=null,episode=null){const status=document.getElementById('source-status'),list=document.getElementById('source-list');if(!status||!list)return;status.textContent=season!==null?`Searching ${item.title} · S${String(season).padStart(2,'0')} E${String(episode).padStart(2,'0')}…`:'Checking your sources…';list.innerHTML='';try{let url=`/api/discovery/title?id=${encodeURIComponent(item.id)}&type=${item.type}`;if(season!==null)url+=`&season=${season}&episode=${episode}`;const d=await api(url);const sources=[...(d.torbox||[]).map(x=>({...x,_provider:'TorBox Search'})),...(d.streams||[]).map(x=>({...x,_provider:x.addon||'Stremio add-on'}))].filter(x=>x.url||x.urlExternal||x.externalUrl||x.infoHash||x.hash);status.textContent=sources.length?`${sources.length} stream options`:d.errors?.length?`No streams · ${d.errors.join(' · ')}`:'No stream options found';list.innerHTML=sources.map((s,i)=>`<div class="setting-row"><div><b>${esc(s.title||s.name||s._provider)}</b><small>${esc(s._provider)} · ${esc(s.quality||s.description||s.size||'Stream')}</small></div><button class="btn small" data-stream-index="${i}">▶ Play</button></div>`).join('')||`<div style="padding:12px;color:var(--muted);font-size:12px">${item.type==='tv'?'No playable episode streams were returned. Check the add-on supports series and that the chosen episode has a stream.':'Add Stremio add-ons in Settings, or check the TorBox connection.'}</div>`;const episodeTitle=season===null?item.title:`${item.title} S${String(season).padStart(2,'0')}E${String(episode).padStart(2,'0')}`;document.querySelectorAll('[data-stream-index]').forEach(b=>b.onclick=()=>playSource(sources[Number(b.dataset.streamIndex)],{...item,streamTitle:episodeTitle}))}catch(e){status.textContent=e.message}}
async function playSource(source,item){const url=source.url||source.urlExternal||source.externalUrl;try{const resolved=await api('/api/discovery/resolve',{method:'POST',body:JSON.stringify({url,infoHash:source.infoHash||source.hash,title:item.streamTitle||item.title,fileIdx:source.fileIdx})});await api('/api/player/open',{method:'POST',body:JSON.stringify({url:resolved.url,title:item.streamTitle||item.title})});toast('Opening stream in VLC')}catch(e){toast(e.message)}}
function playUrl(url,title){api('/api/player/open',{method:'POST',body:JSON.stringify({url,title})}).then(()=>toast('Opening stream in VLC')).catch(e=>toast(e.message))}
window.addEventListener('beforeunload',()=>{try{navigator.sendBeacon('/api/shutdown',new Blob([], {type:'application/json'}))}catch{}});document.getElementById('search').addEventListener('input',()=>{const q=document.getElementById('search').value.trim(),target=state.page;if(state.page==='Discover'||['Movies','TV Shows'].includes(state.page)||(q&&['Home','Settings'].includes(state.page))){if(q&&['Home','Settings'].includes(state.page)){state.page='Discover';state.catalog=[];renderNav()}clearTimeout(catalogTimer);if(!q){state.catalog=[];if(state.page==='Discover')renderDiscover();else render()}else catalogTimer=setTimeout(()=>searchCatalog(q,target),350)}else render()});load().catch(e=>{document.getElementById('content').innerHTML=`<div class="empty"><strong>Host could not load the library.</strong><p>${esc(e.message)}</p></div>`});
</script></body></html>
